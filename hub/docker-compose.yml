services:
  oneterm:
    build:
      context: .
      dockerfile: hub/Dockerfile
    image: oneterm:local
    container_name: oneterm
    user: "1000:1000"
    ports:
      - 7317:7317
    volumes:
      - ./data:/data
    # .env sets ONETERM_TOKEN, the same token as the Mac's ~/.oneterm/hub.json,
    # and ONETERM_HOSTS, every host:port you'll open the page with.
    env_file:
      - path: .env
        required: true
    mem_limit: 128m
    restart: unless-stopped
