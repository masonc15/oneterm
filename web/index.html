<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oneterm</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%221 1.5 32 32%22%3E%3Crect x=%221%22 y=%225%22 width=%2232%22 height=%2225%22 rx=%225%22 fill=%22%231c1d1f%22/%3E%3Crect x=%221%22 y=%225%22 width=%2213%22 height=%226%22 rx=%222%22 fill=%22%232b55c7%22/%3E%3Cpath d=%22M8 17l4 3.5-4 3.5%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 24h8%22 stroke=%22%23fff%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f6f2;
    --card: #ffffff;
    --ink: #1c1d1f;
    --ink-2: #55585e;
    --ink-3: #8a8d93;
    --rule: #e4e2dc;
    --accent: #2b55c7;
    --accent-soft: #e8eefc;
    --warn: #9a5b00;
    --warn-soft: #fbf1df;
    --danger: #b3261e;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --display: "Oxygen", "IBM Plex Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); color: var(--ink); }
  body { margin: 0; font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 28px 96px; }

  header {
    display: flex; align-items: center; gap: 24px;
    padding: 28px 0 22px; border-bottom: 1px solid var(--rule);
  }
  .mark { display: flex; align-items: center; gap: 12px; }
  .mark svg { flex: none; }
  .mark h1 { margin: 0; font: 700 26px/1 var(--display); letter-spacing: -0.01em; }
  .mark h1 span { color: var(--accent); }
  .total { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    height: 34px; padding: 0 14px; border-radius: 7px; font-weight: 500; font-size: 14px;
    border: 1px solid var(--rule); background: var(--card);
  }
  .btn:hover { border-color: #cfccc4; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #33353a; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn { display: inline-flex; align-items: center; gap: 8px; }
  .badge { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center;
    font: 600 12px/1 var(--sans); background: #ecebe6; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .btn.primary .badge { background: rgba(255,255,255,.18); color: #fff; }
  .badge:empty { display: none; }
  .tabs-note { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; text-align: right; }
  .tabs-note:empty { display: none; }
  .stash-box { position: relative; }
  .pop {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 10; width: 320px;
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(28, 29, 31, .12), 0 2px 6px rgba(28, 29, 31, .06);
    padding: 12px 14px 10px; font-size: 13.5px; display: none;
  }
  .pop.show { display: block; }
  .pop h3 { margin: 0 0 6px; font: 600 11px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .pop h3 + ul { margin-bottom: 12px; }
  .pop ul { list-style: none; margin: 0; padding: 0; }
  .pop li { display: flex; align-items: center; gap: 8px; padding: 3px 0; min-width: 0; }
  .pop li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop .k { flex: none; width: 20px; height: 18px; border-radius: 4px; display: grid; place-items: center;
    font: 500 11px/1 var(--mono); background: #efeee9; color: var(--ink-2); }
  .pop .k.pi { background: var(--accent-soft); color: var(--accent); font: 700 12px/1 var(--display); }
  .pop .reason { margin: 2px 0 2px; color: var(--warn); font-weight: 500; }
  .pop .reason + ul li { padding-left: 4px; color: var(--ink-2); }
  .pop .reason + ul li::before { content: "·"; color: var(--ink-3); }
  .pop .fix { color: var(--ink-3); font-size: 12.5px; margin: 0 0 8px 4px; }
  .pop .fix code { font: 12px var(--mono); background: #ecebe6; padding: 0 4px; border-radius: 3px; }
  .pop > :last-child { margin-bottom: 0; }
  .tabs-note { cursor: default; }
  .picker { width: 380px; padding: 12px 6px 8px; }
  .picker h3 { padding: 0 8px; }
  .picker .row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; min-width: 0; }
  .picker .row:hover { background: #f6f5f1; }
  .picker .row.kept { cursor: default; color: var(--ink-3); }
  .picker .row.kept:hover { background: none; }
  .picker input { flex: none; margin: 0; width: 15px; height: 15px; accent-color: var(--accent); }
  .picker .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker .front { flex: none; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .picker .why { flex: none; max-width: 45%; font-size: 12px; color: var(--warn); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker .foot { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 10px 8px 2px; border-top: 1px solid var(--rule); font-size: 13.5px; }
  .picker .foot .btn { margin-left: auto; }
  li.item[draggable="true"] { cursor: grab; }
  li.item.dragging { opacity: .4; }
  li.item.drop-before { box-shadow: inset 0 3px 0 -1px var(--accent); }
  ul.items.drop-end > li.item:last-child { box-shadow: inset 0 -3px 0 -1px var(--accent); }
  ul.items.drop-end:empty, section.group.drop-target ul.items { outline: 2px dashed var(--accent); outline-offset: 2px; }
  body.drag-active button.title { pointer-events: none; }
  .tabs-note.over { color: var(--warn); font-weight: 500; }

  .group { margin-top: 30px; }
  .group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0 2px 8px; }
  .count { font: 700 17px/1.2 var(--display); }
  .when { color: var(--ink-3); font-size: 13.5px; }
  .note { flex-basis: 100%; color: var(--ink-2); font-style: italic; font-size: 14px; }
  .group-actions { margin-left: auto; display: flex; gap: 14px; font-size: 13.5px; }
  .link { color: var(--accent); }
  .link:hover { text-decoration: underline; }
  .link.danger { color: var(--ink-3); }
  .link.danger:hover { color: var(--danger); }

  ul.items { list-style: none; margin: 0; padding: 4px 0; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; }
  li.item { position: relative; display: grid; grid-template-columns: 28px 1fr auto; gap: 0 12px; padding: 9px 14px; }
  li.item + li.item { border-top: 1px solid #efede8; }
  li.item.split { border-top-style: dashed; }
  li.item:hover { background: #fafaf8; }
  .kind {
    grid-row: span 2; align-self: start; margin-top: 1px;
    width: 26px; height: 22px; border-radius: 5px; display: grid; place-items: center;
    font: 500 13px/1 var(--mono); background: #efeee9; color: var(--ink-2);
  }
  .kind.pi { background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 14px; }
  .line1 { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .title { font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  button.title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .cwd { font: 12.5px/1.2 var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 60px; }
  .chip { font-size: 12px; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.wait { background: #eef0f3; color: var(--ink-2); }
  .chip.wait::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--ink-3); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .line2 { grid-column: 2; color: var(--ink-2); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line2.cmd { font: 12.5px/1.45 var(--mono); color: var(--ink-3); }
  .del { grid-row: 1 / span 2; grid-column: 3; align-self: center; width: 26px; height: 26px; border-radius: 6px; color: var(--ink-3); opacity: 0; font-size: 18px; line-height: 1; }
  li.item:hover .del, .del:focus-visible { opacity: 1; }
  @media (hover: none) { .del { opacity: 1; } }
  .mac { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; font-size: 13px; color: var(--ink-3); }
  .mac::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #b9b6ae; }
  .mac.on { color: #2f7a3e; }
  .mac.on::before { background: #3ea152; }
  .chip.queued { background: var(--accent-soft); color: var(--accent); }
  .chip.queued button { color: inherit; text-decoration: underline; margin-left: 6px; font-size: 12px; }
  .del:hover { background: #f3e7e6; color: var(--danger); }

  details.older { margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 16px; }
  details.older summary { cursor: pointer; color: var(--ink-2); font-weight: 500; }

  .empty { text-align: center; padding: 96px 20px; color: var(--ink-2); }
  .empty h2 { font: 700 22px/1.2 var(--display); color: var(--ink); margin: 0 0 8px; }
  .empty code, .hint code { font: 13px var(--mono); background: #ecebe6; padding: 1px 6px; border-radius: 4px; }
  .hint { margin-top: 40px; color: var(--ink-3); font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px;
    transition: opacity .18s, transform .18s; pointer-events: none; max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } .chip.wait::before { animation: none; } }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px 64px; }
    header { flex-wrap: wrap; } .actions { margin-left: 0; } .cwd { display: none; }
    .mac { display: flex; margin-left: 0; margin-top: 2px; }
    .pop { left: 0; right: auto; max-width: calc(100vw - 32px); }
    .tabs-note { text-align: left; }
    .line1 { flex-wrap: wrap; row-gap: 4px; }
    .title { white-space: normal; }
    .line2 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="5" width="32" height="25" rx="5" fill="#1c1d1f"/>
        <rect x="1" y="5" width="13" height="6" rx="2" fill="#2b55c7"/>
        <path d="M8 17l4 3.5-4 3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 24h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>one<span>term</span></h1>
        <div class="total"><span id="total">&nbsp;</span><span class="mac" id="mac"></span></div>
      </div>
    </div>
    <div class="actions">
      <div class="stash-box" id="stash-box">
        <div style="display:flex; gap:8px">
          <button class="btn" id="choose" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker">Choose tabs…</button>
          <button class="btn primary" id="stash-all" title="Stash every Ghostty tab">Stash all tabs <span class="badge"></span></button>
        </div>
        <div class="tabs-note" id="tabs-note"></div>
        <div class="pop" id="pop" role="tooltip"></div>
        <div class="pop picker" id="picker" role="dialog" aria-label="Choose tabs to stash"></div>
      </div>
    </div>
  </header>
  <main id="list"></main>
  <p class="hint">Click a title to reopen it in Ghostty on your Mac, and it comes off this list. Drag an entry to move it to another group. If the Mac's offline, your clicks wait until it's back.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const OLDER_THAN_DAYS = 14;
const KIND = { pi: "π", claude: "C", codex: "X", shell: "$", ssh: "⇄", command: "▸" };
const list = document.getElementById("list");
let lastJson = "";

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

async function post(path, data) {
  const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-oneterm": "1" }, body: JSON.stringify(data) });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  const d = Math.round(s / 86400);
  return d === 1 ? "yesterday" : `${d} days ago`;
}

function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }

async function act(path, data, done) {
  try {
    const r = await post(path, data);
    toast(done(r));
  } catch (err) {
    toast(`Failed: ${err.message}`);
  }
  refresh(true);
}

function restoredText(r) {
  if (r.queued) return `Mac is offline; ${r.count === 1 ? "it reopens" : `${plural(r.count, "terminal")} reopen`} when it's back`;
  const parts = [];
  if (r.restored.length) parts.push(`Reopened ${r.restored.length === 1 ? r.restored[0] : plural(r.restored.length, "terminal")}`);
  if (r.missing.length) parts.push(`session file missing for ${r.missing.join(", ")}`);
  return parts.join(" · ") || "Nothing to restore";
}

function itemRow(item, prev) {
  const pending = item.status === "pending" || Boolean(item.queuedAction);
  const title = pending
    ? el("span", { class: "title" }, item.title)
    : el("button", { class: "title", title: item.lastUser ? `You: ${item.lastUser}` : "Reopen in Ghostty",
        onclick: () => act("/api/restore", { itemIds: [item.id] }, restoredText) }, item.title);
  const chips = [];
  if (item.queuedAction) chips.push(el("span", { class: "chip queued" }, "reopens when the Mac is back",
    el("button", { onclick: () => act("/api/cancel", { actionId: item.queuedAction }, () => "Cancelled") }, "cancel")));
  else if (pending) chips.push(el("span", { class: "chip wait" }, "finishing current step"));
  else if (item.interrupted) chips.push(el("span", { class: "chip warn", title: "The agent stopped at a safe point mid-task. Say “continue” after resuming." }, "stopped mid-task"));
  const said = item.lastAssistant || (item.lastUser ? `You: ${item.lastUser}` : "");
  const second = said
    ? el("div", { class: "line2", title: said }, said)
    : item.restoreCommand && item.kind !== "pi"
      ? el("div", { class: "line2 cmd" }, `$ ${item.restoreCommand}`)
      : null;
  return el("li", { class: `item${prev && prev.tabKey === item.tabKey ? " split" : ""}`, "data-id": item.id,
      draggable: pending ? null : "true",
      ondragstart: (e) => {
        drag = { id: item.id };
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", item.id);
        e.currentTarget.classList.add("dragging");
        document.body.classList.add("drag-active");
      },
      ondragend: (e) => { e.currentTarget.classList.remove("dragging"); endDrag(); } },
    el("span", { class: `kind ${item.kind}`, title: item.kind }, KIND[item.kind] || "?"),
    el("div", { class: "line1" }, title, item.title === item.cwdShort ? null : el("span", { class: "cwd", title: item.cwd }, `${item.remote ? item.remote.host + ": " : ""}${item.cwdShort}`), chips),
    second,
    pending ? null : el("button", { class: "del", title: "Delete without restoring", "aria-label": `Delete ${item.title}`,
      onclick: () => act("/api/delete", { itemIds: [item.id] }, (r) => `Deleted ${item.title}${r.queued ? " (syncs when the Mac is back)" : ""}`) }, "×"),
  );
}

// The entry being dragged, if any. Polling pauses while it is set so the list isn't rebuilt mid-drag.
let drag = null;

function clearDropMarks() {
  for (const n of document.querySelectorAll(".drop-before, .drop-end, .drop-target"))
    n.classList.remove("drop-before", "drop-end", "drop-target");
}

function endDrag() {
  drag = null;
  clearDropMarks();
  document.body.classList.remove("drag-active");
}

/** Where a drop at this point would land: before an entry, or at the end of the list. */
function dropSpot(section, y) {
  const rows = [...section.querySelectorAll("li.item")].filter((li) => li.dataset.id !== drag.id);
  const before = rows.find((li) => { const r = li.getBoundingClientRect(); return y < r.top + r.height / 2; });
  return { before, list: section.querySelector("ul.items") };
}

function dropHandlers(groupId) {
  return {
    ondragover: (e) => {
      if (!drag) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const section = e.currentTarget;
      const { before, list } = dropSpot(section, e.clientY);
      clearDropMarks();
      section.classList.add("drop-target");
      if (before) before.classList.add("drop-before");
      else list.classList.add("drop-end");
    },
    ondragleave: (e) => {
      if (!e.currentTarget.contains(e.relatedTarget)) clearDropMarks();
    },
    ondrop: (e) => {
      if (!drag) return;
      e.preventDefault();
      const { before } = dropSpot(e.currentTarget, e.clientY);
      const id = drag.id;
      const title = document.querySelector(`li.item[data-id="${CSS.escape(id)}"] .title`)?.textContent || "entry";
      endDrag();
      act("/api/move", { itemIds: [id], groupId, beforeId: before?.dataset.id },
        (r) => r.moved ? `Moved ${title}${r.queued ? " (syncs when the Mac is back)" : ""}` : "Nothing moved");
    },
  };
}

function groupBlock(g) {
  const created = new Date(g.createdAt);
  const busy = g.items.some((i) => i.status === "pending");
  return el("section", { class: "group", ...dropHandlers(g.id) },
    el("div", { class: "group-head" },
      el("span", { class: "count" }, plural(g.items.length, "terminal")),
      el("span", { class: "when", title: created.toLocaleString() },
        `Stashed ${created.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} · ${ago(g.createdAt)}`),
      el("span", { class: "group-actions" },
        el("button", { class: "link", disabled: busy, onclick: () => act("/api/restore", { groupId: g.id }, restoredText) }, "Restore all"),
        el("button", { class: "link danger", disabled: busy, onclick: () => {
          if (confirm(`Delete these ${plural(g.items.length, "terminal")} from the stash? pi sessions stay on disk.`))
            act("/api/delete", { groupId: g.id }, (r) => `Deleted ${plural(r.deleted, "terminal")}`);
        } }, "Delete all")),
      g.note ? el("div", { class: "note" }, g.note) : null),
    el("ul", { class: "items" }, g.items.map((item, i) => itemRow(item, g.items[i - 1]))),
  );
}

let lastTabs = null;
let popFor = null;
const FIX = {
  "pi needs /reload-all": ["Started before oneterm was installed.", "Run /reload-all in any pi tab."],
};

function keptLabel(reason) {
  return reason.startsWith("running ") ? `Running ${reason.slice(8)}` : FIX[reason] ? "pi without oneterm" : reason;
}

function showPop(which) {
  if (picking) return;
  const pop = document.getElementById("pop");
  const c = lastTabs?.[which];
  popFor = which;
  if (!c) return pop.classList.remove("show");
  const nodes = [];
  if (c.stash.length) {
    nodes.push(el("h3", {}, `Will be stashed · ${c.stash.length}`),
      el("ul", {}, c.stash.map((t) => el("li", {}, el("span", { class: `k ${t.kind}` }, KIND[t.kind] || "?"), el("span", { title: t.title }, t.title)))));
  } else {
    nodes.push(el("h3", {}, "Nothing to stash"));
  }
  if (c.kept.length) {
    nodes.push(el("h3", {}, `Stays open · ${c.kept.length}`));
    const byReason = new Map();
    for (const k of c.kept) byReason.set(k.reason, [...(byReason.get(k.reason) || []), k.title]);
    for (const [reason, titles] of byReason) {
      const fix = FIX[reason];
      nodes.push(el("div", { class: "reason" }, keptLabel(reason)));
      nodes.push(el("ul", {}, titles.map((t) => el("li", {}, el("span", { title: t }, t)))));
      if (fix) {
        const [why, how] = fix;
        const cmd = how.match(/\/[\w-]+/)?.[0];
        nodes.push(el("p", { class: "fix" }, `${why} `, cmd ? [how.split(cmd)[0], el("code", {}, cmd), how.split(cmd)[1]] : how));
      }
    }
  }
  pop.replaceChildren(...nodes);
  pop.classList.add("show");
}

function hidePop() {
  popFor = null;
  document.getElementById("pop").classList.remove("show");
}

function renderMac(mac, tabs) {
  const node = document.getElementById("mac");
  node.className = `mac${mac.online ? " on" : ""}`;
  node.textContent = mac.online ? "Mac online" : mac.seenAt ? `Mac offline · seen ${ago(new Date(mac.seenAt).toISOString())}` : "Mac never connected";
  const all = document.getElementById("stash-all");
  const c = mac.online ? tabs?.all : null;
  all.querySelector(".badge").textContent = c ? String(c.tabs) : "";
  all.disabled = !mac.online || all.dataset.busy === "1" || (c && c.tabs === 0);
  all.title = !mac.online ? "The Mac is offline" : !c ? all.dataset.title : "";
  const choose = document.getElementById("choose");
  choose.disabled = !mac.online || choose.dataset.busy === "1" || !tabs?.list?.length;
  choose.title = !mac.online ? "The Mac is offline" : "Pick which Ghostty tabs to stash";
  lastTabs = mac.online ? tabs : null;
  if (popFor) showPop(popFor);
  if (picking) renderPicker();
  const kept = mac.online && tabs ? tabs.all.kept.length : 0;
  const over = mac.online && tabs && tabs.cap > 0 && tabs.open > tabs.cap;
  const note = document.getElementById("tabs-note");
  note.classList.toggle("over", Boolean(over));
  note.textContent = mac.online && tabs
    ? `${plural(tabs.open, "tab")} open in Ghostty${over ? ` (limit is ${tabs.cap})` : ""}${kept ? ` · ${kept} can't be stashed` : ""}`
    : "";
}

function render(state) {
  renderMac(state.mac, state.tabs);
  const total = state.groups.reduce((n, g) => n + g.items.length, 0);
  document.getElementById("total").textContent = total ? `${plural(total, "terminal")} in ${plural(state.groups.length, "group")}` : "Nothing stashed";
  document.title = total ? `oneterm (${total})` : "oneterm";
  if (!state.groups.length) {
    list.replaceChildren(el("div", { class: "empty" },
      el("h2", {}, "Nothing stashed"),
      el("p", {}, "When the tabs pile up, stash them here and come back to one at a time."),
      el("p", {}, "Use the buttons above, ", el("code", {}, "/oneterm"), " in pi, or ", el("code", {}, "oneterm stash"), " in a shell.")));
    return;
  }
  const cutoff = Date.now() - OLDER_THAN_DAYS * 86400e3;
  const recent = state.groups.filter((g) => new Date(g.createdAt) >= cutoff);
  const older = state.groups.filter((g) => new Date(g.createdAt) < cutoff);
  const nodes = recent.map(groupBlock);
  if (older.length) {
    const n = older.reduce((k, g) => k + g.items.length, 0);
    nodes.push(el("details", { class: "older" },
      el("summary", {}, `Older than ${OLDER_THAN_DAYS} days: ${plural(n, "terminal")}`),
      older.map(groupBlock)));
  }
  const open = list.querySelector("details.older")?.open;
  list.replaceChildren(...nodes);
  if (open) list.querySelector("details.older").open = true;
}

async function refresh(force) {
  if (drag) return;
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    const text = await res.text();
    if (!force && text === lastJson) return;
    lastJson = text;
    render(JSON.parse(text));
  } catch {
    document.getElementById("total").textContent = "Can't reach the oneterm hub";
  }
}

function stashedText(r) {
  const n = r.stashed.length + r.pending.length;
  const parts = [n ? `Stashed ${plural(n, "terminal")}` : "Nothing to stash"];
  if (r.pending.length) parts.push(`${r.pending.length} finishing current step`);
  if (r.skipped.length) parts.push(`kept open: ${r.skipped.map((s) => s.title).join(", ")}`);
  return parts.join(" · ");
}

async function stashWith(btn, data) {
  btn.disabled = true;
  btn.dataset.busy = "1";
  await act("/api/stash", data, stashedText);
  delete btn.dataset.busy;
  refresh(true);
}

/** Keys of the tabs checked in the picker, or null while it's closed. */
let picking = null;

function openPicker() {
  if (!lastTabs?.list) return;
  hidePop();
  picking = new Set(lastTabs.list.filter((t) => !t.kept).map((t) => t.key));
  document.getElementById("choose").setAttribute("aria-expanded", "true");
  renderPicker();
  document.querySelector("#picker input:not([disabled])")?.focus();
}

function closePicker() {
  if (!picking) return;
  picking = null;
  document.getElementById("choose").setAttribute("aria-expanded", "false");
  document.getElementById("picker").classList.remove("show");
}

function renderPicker() {
  const picker = document.getElementById("picker");
  const rows = lastTabs?.list;
  if (!rows) return closePicker();
  // Tabs that closed or became unstashable since the last look drop out; new ones start unchecked.
  for (const key of picking) if (!rows.some((t) => t.key === key && !t.kept)) picking.delete(key);
  const focused = document.activeElement?.closest?.("#picker [data-key]")?.dataset.key;
  const open = rows.filter((t) => !t.kept);
  const n = picking.size;
  const row = (t) => el("label", { class: `row${t.kept ? " kept" : ""}`, "data-key": t.key, title: t.kept ? `${t.title}: stays open (${keptLabel(t.kept)})` : t.title },
    el("input", { type: "checkbox", checked: picking.has(t.key), disabled: Boolean(t.kept),
      onchange: (e) => { e.target.checked ? picking.add(t.key) : picking.delete(t.key); renderPicker(); } }),
    el("span", { class: `k ${t.kept ? "" : t.kind}` }, t.kept ? "–" : KIND[t.kind] || "?"),
    el("span", { class: "t" }, t.title),
    t.front ? el("span", { class: "front", title: "The selected tab in Ghostty's front window" }, "in front") : null,
    t.kept ? el("span", { class: "why" }, keptLabel(t.kept)) : null);
  const every = open.length > 0 && n === open.length;
  const go = el("button", { class: "btn primary", disabled: n === 0,
    onclick: () => { const picked = [...picking]; closePicker(); stashWith(document.getElementById("choose"), { picked }); } },
    n ? `Stash ${plural(n, "tab")}` : "Stash");
  picker.replaceChildren(
    el("h3", {}, `Open in Ghostty · ${rows.length}`),
    ...rows.map(row),
    el("div", { class: "foot" },
      open.length > 1 ? el("button", { class: "link", onclick: () => { picking = new Set(every ? [] : open.map((t) => t.key)); renderPicker(); } },
        every ? "Select none" : "Select all") : null,
      go));
  picker.classList.add("show");
  if (focused) picker.querySelector(`[data-key="${CSS.escape(focused)}"] input`)?.focus();
}

const stashAll = document.getElementById("stash-all");
stashAll.addEventListener("click", () => stashWith(stashAll, { scope: "all" }));
stashAll.dataset.title = stashAll.title;
stashAll.setAttribute("aria-describedby", "pop");
stashAll.addEventListener("mouseenter", () => showPop("all"));
stashAll.addEventListener("focus", () => showPop("all"));
stashAll.addEventListener("blur", hidePop);
stashAll.addEventListener("click", hidePop);
document.getElementById("choose").addEventListener("click", () => (picking ? closePicker() : openPicker()));
// composedPath, not contains: a click that re-renders the picker has already detached its target.
document.addEventListener("click", (e) => { if (picking && !e.composedPath().some((n) => n.id === "stash-box")) closePicker(); });
// Over the gap or the note, keep showing whichever popover is open; on touch, tap the note.
document.getElementById("stash-box").addEventListener("mouseleave", hidePop);
document.getElementById("tabs-note").addEventListener("click", () => (popFor ? hidePop() : showPop("all")));
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (picking) { closePicker(); document.getElementById("choose").focus(); }
  hidePop();
});

refresh(true);
setInterval(() => { if (!document.hidden) refresh(false); }, 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
</script>
</body>
